{% extends "base.html" %}

{% block title %}'Thẻ' - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="tags-container">
    <header class="list-header text-center">
        <h1 class="list-title"><svg class="icon"><use href="/theme/images/icons.svg#tags"></use></svg> 'Thẻ'</h1>
        <p class="list-subtitle">Duyệt bài viết theo thẻ để tìm nội dung bạn quan tâm.</p>
    </header>

    <div class="tag-cloud">
        {% for tag, articles in tags|sort %}
        <a href="{{ SITEURL }}/{{ tag.url }}" class="tag-item" style="font-size: {{ 80 + articles|length * 20 }}%">
            <span>{{ tag }}</span>
            <sup class="tag-count">{{ articles|length }}</sup>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
