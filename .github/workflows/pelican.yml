name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Vietnamese locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen vi_VN.UTF-8
          sudo update-locale LANG=vi_VN.UTF-8
        env:
          LANG: vi_VN.UTF-8
          LC_ALL: vi_VN.UTF-8

      - name: Build site
        env:
          PUBLISH: "true"
          LANG: vi_VN.UTF-8
          LC_ALL: vi_VN.UTF-8
        run: pelican --settings publishconf.py --output output

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
