<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .CodeMirror { background-color: #1f2937 !important; color: #f3f4f6 !important; border: 1px solid #374151 !important; }
        .CodeMirror-gutters { background-color: #111827 !important; border-right: 1px solid #374151 !important; }
        .editor-preview { background-color: #1f2937 !important; color: #f3f4f6 !important; }
        .editor-preview-side { background-color: #1f2937 !important; border-left: 1px solid #374151 !important; }
        .CodeMirror-cursor { border-left: 1px solid #60a5fa !important; }
        .editor-toolbar {
            background-color: #374151 !important;
            border: 1px solid #4b5563 !important;
            border-bottom: none !important;
            opacity: 1 !important;
        }
        .editor-toolbar button { color: #f9fafb !important; border: none !important; }
        .editor-toolbar button i, .editor-toolbar a i, .editor-toolbar a::before, .editor-toolbar button::before { color: #f9fafb !important; }
        .editor-toolbar a { color: #f9fafb !important; }
        .editor-toolbar button:hover, .editor-toolbar button.active { background-color: #2563eb !important; border-color: #2563eb !important; }
        .editor-toolbar i.separator { border-left: 1px solid #6b7280 !important; border-right: 1px solid #4b5563 !important; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-gray-900 border-r border-gray-800 p-6 flex flex-col">
            <h1 class="text-2xl font-bold mb-8">📝 Admin</h1>
            <nav class="space-y-3 flex-1">
                <a href="/" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
                    <i class="fas fa-list w-4"></i> Tất cả bài viết
                </a>
                <a href="/new" class="flex items-center gap-3 px-4 py-2 rounded-lg {% if is_new %}bg-blue-600{% else %}hover:bg-gray-800{% endif %} transition">
                    <i class="fas fa-plus w-4"></i> Tạo bài mới
                </a>
                <a href="/pages" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
                    <i class="fas fa-file w-4"></i> Quản lý Trang
                </a>
                <a href="/tags" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
                    <i class="fas fa-tags w-4"></i> Quản lý Thẻ
                </a>
            </nav>
            <div class="space-y-2 border-t border-gray-800 pt-4">
                <a href="https://viethoa.nguyez.com/" target="_blank" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-green-700 hover:bg-green-600 transition text-sm">
                    <i class="fas fa-globe w-4"></i> Xem website
                </a>
                <button id="btnGitPush" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg bg-purple-700 hover:bg-purple-600 transition text-sm">
                    <i class="fas fa-cloud-upload-alt w-4"></i> Đẩy lên website
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-auto p-8">
            <header class="mb-8 flex justify-between items-center">
                <h2 class="text-3xl font-bold">{% if is_new %}Tạo bài viết mới{% else %}Chỉnh sửa: {{ filename }}{% endif %}</h2>
                <div class="flex items-center gap-3">
                    {% if not is_new %}
                    <a href="https://viethoa.nguyez.com/{{ metadata.get('slug', '') }}/" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-green-700 hover:bg-green-600 rounded-lg text-sm transition">
                        <i class="fas fa-eye"></i> Xem bài viết
                    </a>
                    {% endif %}
                    <a href="/" class="text-gray-400 hover:text-gray-300 flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                </div>
            </header>

            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-900 p-6 rounded-xl border border-gray-800">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-400">Tiêu đề</label>
                            <input type="text" name="title" id="titleInput" value="{{ metadata.get('title', '') }}" required class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-400">Slug (URL)</label>
                            <input type="text" name="slug" id="slugInput" value="{{ metadata.get('slug', '') }}" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="tự động tạo nếu để trống">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-400">Danh mục</label>
                            <input type="text" name="category" value="{{ metadata.get('category', 'Game Việt hoá') }}" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-400">Ngày đăng</label>
                            <input type="datetime-local" name="date" value="{{ metadata.get('date', '') }}" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-400">Thumbnail</label>
                            <div class="flex gap-2">
                                <input type="text" id="thumbUrl" name="thumbnail" value="{{ metadata.get('thumbnail', '') }}" class="flex-1 px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <input type="file" id="fileInput" class="hidden" onchange="uploadFile()">
                                <button type="button" onclick="document.getElementById('fileInput').click()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition"><i class="fas fa-upload"></i></button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-400">Thẻ</label>
                            <input type="text" id="tagInput" name="tags" value="{{ metadata.get('tags', [])|join(', ') }}" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <div class="mt-2 flex flex-wrap gap-2">
                                {% for tag in all_tags %}
                                <button type="button" onclick="addTag('{{ tag }}')" class="text-xs px-2 py-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded transition">{{ tag }}</button>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </div>

                <textarea name="content" id="editor" class="w-full">{{ content }}</textarea>

                <div class="flex items-center gap-4">
                    <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-bold transition flex items-center gap-2">
                        <i class="fas fa-save"></i> Lưu thay đổi
                    </button>
                    <div id="statusMsg" class="text-sm font-medium"></div>
                </div>
            </form>
        </main>
    </div>

    <script>
        var simplemde = new SimpleMDE({
            element: document.getElementById("editor"),
            spellChecker: false,
            toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview", "side-by-side", "fullscreen"]
        });
        simplemde.codemirror.getInputField().setAttribute("spellcheck", "false");

        // Auto Slug
        const titleInput = document.getElementById('titleInput');
        const slugInput = document.getElementById('slugInput');
        if (titleInput && slugInput && !slugInput.value) {
            titleInput.addEventListener('input', function() {
                const slug = titleInput.value.toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // Bỏ dấu tiếng Việt
                    .replace(/[đĐ]/g, 'd')
                    .replace(/([^0-9a-z-\s])/g, '')
                    .replace(/(\s+)/g, '-')
                    .replace(/-+/g, '-')
                    .replace(/^-+|-+$/g, '');
                slugInput.value = slug;
            });
        }

        function addTag(tag) {
            const input = document.getElementById('tagInput');
            let tags = input.value.split(',').map(t => t.trim()).filter(t => t);
            if (!tags.includes(tag)) {
                tags.push(tag);
                input.value = tags.join(', ');
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const res = await fetch('/upload_image', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.url) document.getElementById('thumbUrl').value = data.url;
        }

        const btnGitPush = document.getElementById('btnGitPush');
        btnGitPush.addEventListener('click', async () => {
            if (!confirm('Đẩy lên website?')) return;
            btnGitPush.disabled = true;
            btnGitPush.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đẩy...';
            const res = await fetch('/git_push', { method: 'POST' });
            const data = await res.json();
            showToast(data.message, data.status);
            btnGitPush.disabled = false;
            btnGitPush.innerHTML = '<i class="fas fa-cloud-upload-alt w-4"></i> Đẩy lên website';
        });

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-8 right-8 px-6 py-3 rounded-lg shadow-2xl z-50 text-white font-medium ${type==='success'?'bg-emerald-600':'bg-rose-600'}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
